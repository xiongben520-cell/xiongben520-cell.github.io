<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

</head>
<body>
<main class="page">
  <div class="frame">
    <header class="masthead">
      <div class="brand-line">
        <img class="seal-img" src="logo-hongyitang.png" alt="武汉弘医堂中医医院"><span id="hospital"></span>
        <span class="dot">◆</span>
        <img class="seal-img" src="logo-baokuan.png" alt="武汉股骨头保髋诊疗中心"><span id="center"></span>
      </div>
    </header>

    <div class="title-block">
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <form id="surveyForm" novalidate>
      <div id="questions"></div>
      <div class="submit-wrap">
        <button type="submit" id="submitBtn">提 交 调 查 表</button>
        <p class="tip">请确认所有题目均已填写后再提交，感谢您的配合</p>
      </div>
    </form>

    <footer class="footer" id="footer"></footer>
  </div>
</main>

<div class="overlay" id="infoOverlay" hidden>
  <div class="dialog info-dialog">
    <h2 style="margin-top:0;color:var(--brown-dark)">请留下您的姓名</h2>
    <p style="margin-top:0">便于我们核对，姓名将与问卷编号绑定存档</p>
    <form id="infoForm" novalidate>
      <div class="info-field">
        <label for="patientName">姓名</label>
        <input type="text" id="patientName" maxlength="64" placeholder="请输入姓名" autocomplete="name" required>
      </div>
      <p id="infoErr" class="info-err"></p>
      <div class="info-actions">
        <button type="button" class="ghost" id="infoCancel">返回修改</button>
        <button type="submit" id="infoConfirm">确认提交</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog">
    <div class="ok-icon">✓</div>
    <h2>提交成功</h2>
    <p>感谢您配合完成本次调查！<br>您的问卷编号为 <b id="surveyNo"></b>，信息已存档。</p>
    <button id="againBtn">再填一份</button>
  </div>
</div>

<script>window.API_BASE = 'https://hip-surey-proxy-ntfhkbccoh.cn-hangzhou.fcapp.run';</script>
